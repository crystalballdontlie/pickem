name: Nightly standings update

on:
  schedule:
    # GitHub schedules run in UTC, so this fires every hour from 01:07 to 09:07 UTC.
    # The "When" step keeps only the runs that land on the Pacific times listed in
    # UPDATE_HOURS below, in both daylight time (UTC-7) and standard time (UTC-8).
    - cron: "7 1 * * *"
    - cron: "7 2 * * *"
    - cron: "7 3 * * *"
    - cron: "7 4 * * *"
    - cron: "7 5 * * *"
    - cron: "7 6 * * *"
    - cron: "7 7 * * *"
    - cron: "7 8 * * *"
    - cron: "7 9 * * *"
  push:
    branches: [main]
    paths: ["picks.csv", "lines.csv", "config.json", "side_bets.csv", "site/**", "scripts/**"]
  workflow_dispatch:
    inputs:
      season:
        description: "Test: season start year (e.g. 2025 for last season). Leave blank for the live season."
        required: false
      through:
        description: "Test: only count games on or before this date, YYYY-MM-DD. Leave blank for all games."
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: When
        id: when
        env:
          # Pacific-time hours to update on game nights (24-hour clock): 6 PM, 8 PM,
          # 10 PM, midnight and 1 AM. To change them, edit this list.
          UPDATE_HOURS: "18 20 22 0 1"
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Now in Los Angeles: $(TZ=America/Los_Angeles date)"
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Use the time this run was scheduled for, not when it started:
          # GitHub sometimes starts scheduled runs late.
          utc_hour=$(echo "$SCHEDULE" | awk '{print $2}')
          la_hour=$(TZ=America/Los_Angeles date -d "$(date -u +%F) ${utc_hour}:07 UTC" +%-H)
          if [[ " $UPDATE_HOURS " == *" $la_hour "* ]]; then
            echo "Scheduled for ${la_hour}:07 Pacific; updating."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Scheduled for ${la_hour}:07 Pacific, which isn't an update time; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Start from the newest version of main, so this run includes any data
      # saved by an earlier run and any files you uploaded in the meantime.
      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.when.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Pull results and score picks
        if: steps.when.outputs.run == 'true'
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          PICKS_CSV_URL: ${{ secrets.PICKS_CSV_URL }}
          SEASON: ${{ github.event.inputs.season }}
          THROUGH: ${{ github.event.inputs.through }}
        run: |
          args=()
          [ -n "$SEASON" ] && args+=(--season "$SEASON")
          [ -n "$THROUGH" ] && args+=(--through "$THROUGH")
          python scripts/update.py "${args[@]}"

      - name: Save tonight's data to the repo
        if: steps.when.outputs.run == 'true'
        run: |
          git config user.name "standings-bot"
          git config user.email "standings-bot@users.noreply.github.com"
          git add site/data/pool.json
          if git diff --cached --quiet; then echo "No changes to save."; exit 0; fi
          git commit -m "Standings update $(TZ=America/Los_Angeles date +%Y-%m-%d)"
          # If you committed something while this ran, fold it in and try again.
          # On a clash over pool.json, this run's freshly computed copy wins.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying in 10s"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      - uses: actions/configure-pages@v5
        if: steps.when.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.when.outputs.run == 'true'
        with:
          path: site

      - id: deploy
        if: steps.when.outputs.run == 'true'
        uses: actions/deploy-pages@v4
